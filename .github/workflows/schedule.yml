name: Weekly Discord Scheduler

on:
  workflow_dispatch:
  schedule:
    # 10:00 JST every Monday = 01:00 UTC Monday
    - cron: "0 1 * * 1"

jobs:
  run-weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Python via uv and install deps
        run: |
          uv python install 3.11
          uv venv
          uv pip install -r requirements.txt

      - name: Run weekly scheduler
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: "1413686217555578940"
          WEEKDAY_OPTIONS: "月,火,水,木,金"
        run: uv run python app/schedule_weekly.py


